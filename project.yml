# Daybreak — generate the Xcode project with `xcodegen generate`.
# Four targets: the SwiftUI app plus the three Screen Time extensions, all sharing one app group.
name: Daybreak
options:
  bundleIdPrefix: com.pranavgadiraju
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your paid Apple Developer team ID here (or pick it in Xcode under Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ${target_name}
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        # Extension callbacks arrive on system threads; keep these modules nonisolated by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: "YES"
    entitlements:
      path: ${target_name}/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.pranavgadiraju.daybreak

targets:
  Daybreak:
    type: application
    platform: iOS
    sources:
      - path: Daybreak
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak
        PRODUCT_NAME: Daybreak
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Daybreak/Info.plist
      properties:
        CFBundleDisplayName: Daybreak
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Daybreak/Daybreak.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.pranavgadiraju.daybreak
    dependencies:
      - target: DaybreakMonitor
      - target: DaybreakShield
      - target: DaybreakShieldAction

  DaybreakMonitor:
    templates: [ScreenTimeExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak.monitor
    info:
      path: DaybreakMonitor/Info.plist
      properties:
        CFBundleDisplayName: Daybreak Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension

  DaybreakShield:
    templates: [ScreenTimeExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak.shield
    info:
      path: DaybreakShield/Info.plist
      properties:
        CFBundleDisplayName: Daybreak Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  DaybreakShieldAction:
    templates: [ScreenTimeExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak.shieldaction
    info:
      path: DaybreakShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Daybreak Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  DaybreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaybreakTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - target: Daybreak

  DaybreakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaybreakUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranavgadiraju.daybreak.uitests
    dependencies:
      - target: Daybreak

schemes:
  Daybreak:
    build:
      targets:
        Daybreak: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DaybreakTests
        - DaybreakUITests
    archive:
      config: Release
